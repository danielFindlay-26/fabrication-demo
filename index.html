<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Orders</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">

        <h1>Work Order Manager</h1>

        <h2>Create Work Order</h2>

        <input type="number" id="jobNumber" placeholder="Job Number">

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

        <input
            type="text"
            id="status"
            placeholder="Status (Open, In Progress, Complete)"
        >

        <button onclick="createWorkOrder()">
            Create Work Order
        </button>

        <hr>

        <h2>Existing Work Orders</h2>

        <button onclick="loadWorkOrders()">
            Refresh
        </button>

        <table id="workOrdersTable">
            <thead>
                <tr>
                    <th>Job Number</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Update Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

    <script src="app.js"></script>

</body>
</html>
